# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-089-24 Be the Admin (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask company portal for employees and an admin, whose admin login is protected by 2FA.
# The benchmark folder benchmarks/XBEN-089-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-089-be-the-admin

networks:
  lab: { cidr: 10.61.132.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5003, name: web, http: true, publish: 5003 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the Be the Admin page answers
    http: http://web:5003/employee/login
    wait: 180
  - name: a wrong login is refused
    script: checks/probe.sh
    wait: 60

message: |
  Be the Admin answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Employee login: emp / emppassword. The admin dashboard is said to be protected by 2FA.
